<script type="text/javascript">
  function makeAjaxCall() {
    // Create a new XMLHttpRequest object
    var xhr = new XMLHttpRequest();
    // Configure it: specify the type of request and the URL
    xhr.open("GET", "https://jsonplaceholder.typicode.com/todos/1", true);
    // Set up a function to handle the response
    xhr.onreadystatechange = function () {
      // Check if the request is complete
      if (xhr.readyState == 4 && xhr.status == 200) {
        // Parse the JSON response
        var response = JSON.parse(xhr.responseText);
        // Display the result
        document.getElementById("result").innerHTML =
          "User ID: " + response.userId + "<br>Title: " + response.title;
      }
    };
    // Send the request
    xhr.send();
  }

  function getRandomIntInclusive(min, max) {
        min = Math.ceil(min);
        max = Math.floor(max);
        return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  var page_name = "Hybrid Demo";
  var order_number = getRandomIntInclusive(10000, 20000);//crypto.randomUUID(); //  Order Number Collection Variable
  var cart_total = getRandomIntInclusive(200, 700); // Thank You Page Collection Variable
  var cart_items_count = getRandomIntInclusive(5, 15); // Cart Count Variable
</script>
